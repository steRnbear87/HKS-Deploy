version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # ===========================================
      # Database Mode (for true self-hosting)
      # ===========================================
      # "sqlite" - Uses local SQLite database (no external dependencies)
      # "supabase" - Uses Supabase (default, requires Supabase credentials)
      - DATABASE_MODE=${DATABASE_MODE:-supabase}
      - DATABASE_PATH=/data/intuneget.db
      # Overrides the default catalog-snapshot source repo (see
      # lib/catalog/snapshot-store.ts); unset falls back to the upstream
      # ugurkocde/IntuneGet release.
      - CATALOG_SNAPSHOT_BASE_URL=${CATALOG_SNAPSHOT_BASE_URL:-}
      # Temporary demo override: points the self-hosted catalog reader at a
      # local file instead of downloading the published snapshot (see
      # lib/catalog/snapshot-store.ts). Remove this line to go back to normal.
      - CATALOG_SNAPSHOT_FILE=${CATALOG_SNAPSHOT_FILE:-}

      # ===========================================
      # Packager Authentication (for SQLite mode)
      # ===========================================
      # API key for packager authentication when using SQLite mode
      # Generate with: openssl rand -hex 32
      - PACKAGER_API_KEY=${PACKAGER_API_KEY:-}

      # ===========================================
      # Supabase Configuration (optional in SQLite mode)
      # ===========================================
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}

      # ===========================================
      # Microsoft Entra ID (Required)
      # ===========================================
      # NEXT_PUBLIC_AZURE_AD_CLIENT_ID is inlined as empty at Docker
      # build time. AZURE_CLIENT_ID is a non-NEXT_PUBLIC alias that
      # the server component reads at runtime to inject the real value.
      - NEXT_PUBLIC_AZURE_AD_CLIENT_ID=${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      - AZURE_CLIENT_ID=${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}

      # ===========================================
      # Windows Update for Business reports (optional)
      # ===========================================
      # Log Analytics workspace ID for per-device Windows Update status on the
      # Devices page. Requires the "Log Analytics Reader" Azure RBAC role
      # granted directly on this workspace (Azure Portal -> workspace ->
      # Access control (IAM)) - separate from the Graph app registration
      # permissions above. Leave unset to show the "not configured" state.
      - AZURE_LOG_ANALYTICS_WORKSPACE_ID=${AZURE_LOG_ANALYTICS_WORKSPACE_ID:-}

      # ===========================================
      # Packager Mode
      # ===========================================
      # "local" - Use local Windows packager (recommended for self-hosting)
      # "github" - Use GitHub Actions (requires GitHub credentials)
      - PACKAGER_MODE=${PACKAGER_MODE:-local}

      # ===========================================
      # GitHub Actions Pipeline (optional, for github mode)
      # ===========================================
      - GITHUB_PAT=${GITHUB_PAT:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}

      # ===========================================
      # Callback Security (for GitHub mode)
      # ===========================================
      - CALLBACK_SECRET=${CALLBACK_SECRET:-}

      # ===========================================
      # Cron Authentication
      # ===========================================
      # Bearer token required by GET /api/cron/* routes (update checks,
      # deployment-drift, snapshot jobs). Generate with: openssl rand -hex 24
      - CRON_SECRET=${CRON_SECRET:-}

      # ===========================================
      # Application URL
      # ===========================================
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-http://localhost:3000}

      # ===========================================
      # Optional Features
      # ===========================================
      - NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
      - BEEHIIV_API_KEY=${BEEHIIV_API_KEY:-}

    volumes:
      # Persist SQLite database
      - intuneget-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  intuneget-data:
    driver: local
